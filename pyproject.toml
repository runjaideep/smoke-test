[project]
name = "smoke-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JD Sharma", email = "jaideep.sharma@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.65.0",
]

[project.scripts]
smoke-test = "smoke_test:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
